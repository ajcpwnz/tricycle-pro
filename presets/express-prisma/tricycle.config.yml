# Express API with Prisma + PostgreSQL

project:
  name: "my-express-api"
  type: "single-app"
  package_manager: "npm"
  base_branch: "main"

apps:
  - name: api
    path: "."
    type: api
    lint: "npm run lint"
    test: "npm run test"
    build: "npm run build"
    dev: "npm run dev"
    port: 3000
    database:
      type: postgres
      container: postgres
      port: 5432
      user: postgres
      default_db: mydb

worktree:
  enabled: true
  env_copy:
    - .env

mcp:
  preset: "backend-only"
  custom:
    prisma:
      command: "npx"
      args: ["prisma", "mcp"]

qa:
  enabled: false

# /trc.band epic orchestration: max concurrent sub-issue workers (1-8)
band:
  max_parallel: 3

push:
  require_approval: true
  require_lint: true
  require_tests: true
  pr_target: "main"
  auto_merge: false
  merge_strategy: "squash"

branching:
  style: feature-name

stealth:
  enabled: false
  ignore_target: exclude

constitution:
  root: ".trc/memory/constitution.md"

context:
  session_start:
    constitution: true
    # files:
    #   - "docs/architecture.md"

# Each style part acts only when its plugin is installed: caveman for chat,
# asd-ste100 for the lint gate on persisted prose.
style:
  chat: ultracave
  artifacts: ste-short
